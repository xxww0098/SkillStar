[package]
name = "skillstar"
version = "0.0.3"
description = "SkillStar — Skill management for AI agents"
authors = ["SkillStar"]
edition = "2024"
rust-version = "1.94.1"

[lib]
name = "skillstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "rustls", "form"] }
chrono = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
gix = { workspace = true }
toml = { workspace = true }
tauri-plugin-dialog = "2"
serde_yaml = { workspace = true }
regex = { workspace = true }
machine-uid = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
html2md = { workspace = true }
uuid = { workspace = true }
sys-locale = "0.3"
pbkdf2 = "0.12"
rusqlite = { workspace = true }
r2d2_sqlite = { workspace = true }
r2d2 = { workspace = true }
pulldown-cmark = "0.13.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
thiserror = { workspace = true }
petgraph = "0.8.3"
agent-client-protocol = "0.10"
tokio-util = { version = "0.7", features = ["compat"] }
futures = { workspace = true }
async-trait = { workspace = true }
skillstar-marketplace = { path = "../crates/skillstar-marketplace" }
url = { workspace = true }
toml_edit = "0.25.10"
rand = { workspace = true }
urlencoding = "2.1.3"
lazy_static = { workspace = true }
which = { workspace = true }
skillstar-models = { version = "0.1.0", path = "../crates/skillstar-models" }
skillstar-skills = { version = "0.1.0", path = "../crates/skillstar-skills" }
tauri-plugin-deep-link = "2"
skillstar-core = { version = "0.1.0", path = "../crates/skillstar-core" }
skillstar-app = { version = "0.1.0", path = "../crates/skillstar-app" }
skillstar-usage = { version = "0.1.0", path = "../crates/skillstar-usage" }
skillstar-sync = { version = "0.1.0", path = "../crates/skillstar-sync" }
sha2 = { workspace = true }
ts-rs.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tauri = { version = "2", features = ["test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
junction = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem", "NSApplication", "NSResponder"] }
objc2-foundation = "0.3"
