[package]
name = "skillstar"
# The product version, deliberately NOT inherited from [workspace.package] —
# the other members share a placeholder version they never publish. Keep this in
# step with `version` in tauri.conf.json, which carries its own copy.
version = "0.0.4"
description = "SkillStar — Skill management for AI agents"
authors = ["SkillStar"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "skillstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

# This crate is the Tauri command/adapter layer: it registers commands, maps
# DTOs and events, and delegates every piece of domain work to `crates/*`. The
# manifest is kept to what `src-tauri/src/**` actually names — direct
# declarations for crates it never references made this layer look like it did
# its own SQLite, HTTP, git and archive work when it does not.
[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tauri-plugin-dialog = "2"
uuid = { workspace = true }
sys-locale = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
skillstar-marketplace = { path = "../crates/skillstar-marketplace" }
url = { workspace = true }
which = { workspace = true }
skillstar-models = { path = "../crates/skillstar-models" }
skillstar-skills = { path = "../crates/skillstar-skills" }
tauri-plugin-deep-link = "2"
skillstar-core = { path = "../crates/skillstar-core" }
skillstar-app = { path = "../crates/skillstar-app" }
skillstar-usage = { path = "../crates/skillstar-usage" }
skillstar-sync = { path = "../crates/skillstar-sync" }
skillstar-git = { path = "../crates/skillstar-git" }
skillstar-channels = { path = "../crates/skillstar-channels" }
sha2 = { workspace = true }
ts-rs.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
# Re-declared purely to add Tauri's mock runtime feature; the version stays
# pinned by [workspace.dependencies] so it cannot drift from the normal dep.
tauri = { workspace = true, features = ["test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# `junction` used to be declared here too, but no `src-tauri/src/**` file names
# it — the Windows junction work lives in skillstar-core and skillstar-skills,
# which declare it themselves.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem", "NSApplication", "NSResponder"] }
objc2-foundation = "0.3"
