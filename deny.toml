# cargo-deny configuration for SkillStar
# https://embarkstudios.github.io/cargo-deny/
#
# Triage state as of 2026-08-14 (cargo-deny 0.20.2, advisory-db of that day):
#
#   advisories  PASSES  — 4 findings fixed by upgrade, 8 allowlisted below
#                         with a per-entry reason and re-evaluation trigger.
#   bans        PASSES
#   licenses    PASSES  — was the one failing class (html2md, GPL-3.0+). Fixed
#                         by removing that dependency, not by allowlisting it;
#                         see the history note above [[licenses.clarify]].
#   sources     PASSES
#
# `cargo deny check --config deny.toml` is the workspace check. CI points at
# this file and runs cargo-deny 0.22.1, the version cargo-deny-action@v2 pins;
# an older local cargo-deny reports a different set of notices, so check with
# the CI version before trusting a local run. An ignore that matches nothing
# is reported as advisory-not-detected — an error on the versions the notes
# below were written for, a warning on 0.22.1. Stale entries are deleted either way.
#
# Fixed by upgrade in this same change (no allowlist entry needed, and none
# should be added if they come back — they mean a real regression):
#   RUSTSEC-2026-0190  anyhow 1.0.102 -> 1.0.104   (unsound Error::downcast_mut)
#   RUSTSEC-2026-0194  quick-xml 0.38.4 -> 0.41.0  (quadratic run time)
#   RUSTSEC-2026-0195  quick-xml 0.38.4 -> 0.41.0  (unbounded ns allocation)
#   yanked             crypto-bigint 0.7.4 -> 0.7.5
# The quick-xml pair needed `cargo update -p plist` (1.8.0 -> 1.10.0), not
# `cargo update -p quick-xml`: plist's `^0.38` requirement was the thing
# holding the vulnerable version in the lockfile.
#
# Updated 2026-09-22: the ten gtk-rs GTK3 `unmaintained` advisories
# (RUSTSEC-2024-0411 … -0420) were withdrawn from the advisory-db on
# 2026-08-14. cargo-deny denies an `ignore` entry that matches nothing
# (`warning[advisory-not-detected]`), so those ten entries were deleted —
# the allowlist went to 10 entries and nothing was widened, taking the count
# from the 20 recorded on 2026-08-14 down to 10. A fresh advisory-db makes
# any branch fail on the stale entries, which is how this surfaced.
#
# Updated 2026-10-05: the model-domain removal (D-082) took async-openai with
# it, so backoff and instant left Cargo.lock and RUSTSEC-2025-0012 /
# RUSTSEC-2024-0384 became ignores that match nothing. Deleted for the same
# `advisory-not-detected` reason as the GTK3 batch above; the allowlist is now
# 8 entries.
#
# Updated 2026-10-06: retiring Tauri (D-091) removed the GTK3 / tauri-utils
# stack. RUSTSEC-2024-0370 and the tauri-utils unmaintained ignores matched
# nothing afterwards and were deleted.
#
# Updated 2026-11-15 (D-110 / D-111): ss-sync and its russh tree are gone, but
# rsa 0.10.0-rc.19 still arrives — now through nsh-js -> quickjs-jit-stdlib
# (the JS runtime the TSX pages run on). The RUSTSEC-2023-0071 entry stays,
# with its reachability rewritten below.
#
# Updated 2026-11-25 (first v0.0.1 release attempt): the step ran for the
# first time since the nsh migration against a fresh advisory-db and reported
# 12 errors. Fixed by upgrade, no entry needed (a return means a regression):
#   RUSTSEC-2026-0386  tokio 1.52.3 -> 1.54.1                (unsound AsyncFd)
#   RUSTSEC-2026-0592  url 2.5.8 -> 2.5.9                    (Url::origin overflow)
#   RUSTSEC-2026-0383  webpki-root-certs 1.0.7 -> 1.0.12    (distrusted emSign roots)
#   RUSTSEC-2026-0459  rusqlite 0.39.0 -> 0.41.1 with r2d2_sqlite 0.34.0 -> 0.36.0
#                      and libsqlite3-sys 0.37.0 -> 0.39.1  (bundled SQLite CVE)
#   yanked             chacha20 0.10.0 -> 0.10.2
# Five `unmaintained` notices have no fixed version and are allowlisted in
# the UNMAINTAINED group below.
#
# Updated 2026-11-25: cargo-deny 0.22.1 reports `unmaintained` notices for the
# workspace's direct dependencies only. Four of the five UNMAINTAINED entries
# matched nothing on CI (advisory-not-detected) while a 0.20.2 on a developer
# machine still listed them as errors, so `unmaintained = "all"` under
# [advisories] pins the scope the allowlist was written for. The same run
# prints warning[patched] for RUSTSEC-2023-0071 and suggests
# `cargo update -p rsa`: rsa 0.10.0 dropped the `sha2` feature that
# quickjs-jit-stdlib 0.14.2 enables, so `cargo update -p rsa --precise 0.10.0`
# does not resolve and the entry stays until nsh-js moves.

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.22 reports `unmaintained` for the workspace's direct
# dependencies only; the UNMAINTAINED entries below also cover transitive
# crates, so the older scope is stated here instead of inherited.
unmaintained = "all"

# Every entry below is a dependency we cannot move off today. `unmaintained`
# and `vulnerability` are deliberately kept apart: unmaintained is a
# maintenance-risk note, a live vulnerability is a security decision.
ignore = [
  # ---------------------------------------------------------------------
  # VULNERABILITY — one entry, and it is the only one. Read it before you
  # add anything to this group.
  # ---------------------------------------------------------------------
  { id = "RUSTSEC-2023-0071", reason = """
rsa 0.10.0-rc.19 — "Marvin Attack": RSA key recovery through a timing
sidechannel. Reached via nsh-js -> quickjs-jit-stdlib 0.14.2 (the QuickJS
runtime the TSX pages execute in), which links rsa for its WebCrypto
shim. No SkillStar crate calls RSA directly. There is NO fixed version — the advisory's
own answer is "No safe upgrade is available!", and the rsa crate has not
shipped a constant-time fix, so this cannot be resolved by upgrading.

Exposure assessment (honest, not a clean bill of health): SkillStar uses
russh purely as an SSH *client*, connecting to hosts the user configured, to
sync their own skills. The attack needs an adaptive oracle — many chosen
ciphertexts against the same private key with precise timing measurement.
A malicious or MITM'd SSH server the user chose to connect to is the
plausible attacker here, and it does get to observe signing timings, so the
correct claim is "narrow and hard to exploit at scale", NOT "unreachable".
Users who authenticate with Ed25519 keys (russh's and SkillStar's default
path) never exercise the RSA private-key operation at all.

RE-EVALUATE: whenever russh or ssh-key is upgraded, and unconditionally at
the next dependency review or if RUSTSEC-2023-0071 ever gains a patched
version. This entry is a stopgap for an unfixable upstream, not an
acceptance of the risk in perpetuity — it deserves an explicit owner
sign-off it has not yet had.
""" },

  # ---------------------------------------------------------------------
  # UNMAINTAINED — maintenance-risk notes, not vulnerabilities. Each one is
  # here because no fixed version exists; the reason says who pulls the
  # crate in and what moving off it would take.
  # ---------------------------------------------------------------------
  { id = "RUSTSEC-2026-0543", reason = """
chrono 0.4.45 — unmaintained. A direct workspace dependency of ss-accounts,
ss-app, ss-channels, ss-core, ss-git, ss-marketplace, ss-mcp, ss-mcp-hub and
ss-skills, and also reached through every nsh 0.6.1 crate, rmcp and schemars.
The advisory names no fixed version.

Exposure: none today — this is a maintenance notice. The debt is real and it
is ours: nine crates depend on chrono directly, so moving to a maintained
library is a source change, not a lockfile change, and is deliberately not
smuggled into a dependency patch.

RE-EVALUATE: at the next dependency review, schedule the migration; at once
if a vulnerability is filed against chrono.
""" },
  { id = "RUSTSEC-2025-0141", reason = """
bincode 1.3.3 — unmaintained. Reached only through nsh 0.6.1's syntax
highlighter: syntect 5.3.0, via nsh-base and two-face 0.4.5. No SkillStar
crate calls bincode, and nothing here can be upgraded — syntect 5.x is the
line that uses bincode 1, and the nsh crates are pinned to =0.6.1.

Exposure: maintenance notice only. It sits inside syntax highlighting of the
text the app renders, behind the pinned framework version.

RE-EVALUATE: whenever the nsh pins move, or when the advisory-db withdraws
the entry (an ignore that matches nothing fails the check).
""" },
  { id = "RUSTSEC-2026-0206", reason = """
rustybuzz 0.20.1 — unmaintained. Reached only through the nsh SVG renderer:
resvg 0.46.0 -> usvg 0.46.0. No fixed version without a newer resvg, and nsh
pins 0.46. No SkillStar crate calls rustybuzz.

Exposure: maintenance notice only — text shaping inside SVG rendering of the
icons the app ships.

RE-EVALUATE: whenever the nsh pins move, or when the advisory-db withdraws
the entry.
""" },
  { id = "RUSTSEC-2026-0192", reason = """
ttf-parser 0.25.1 — unmaintained. Reached through nsh 0.6.1 only: nsh-core,
nsh-macros, and resvg 0.46.0 (usvg, fontdb, rustybuzz). Same situation as
rustybuzz above — no fixed version, pinned by the framework, and no
SkillStar crate calls it.

Exposure: maintenance notice only — font parsing in nsh's text and SVG
rendering, over the system font set and the app's own assets.

RE-EVALUATE: whenever the nsh pins move, or when the advisory-db withdraws
the entry.
""" },
  { id = "RUSTSEC-2024-0449", reason = """
unsafe-libyaml 0.2.11 — unmaintained. Reached through serde_yaml
0.9.34+deprecated, a direct workspace dependency of ss-core, ss-mcp-hub and
ss-skills: it parses SKILL.md front matter and agent MCP config files.
serde_yaml is archived too, so nothing on this line will be fixed; the
maintained candidates (serde_yaml_ng, serde-saphyr, serde_yml) each parse a
little differently.

Exposure: none today — the advisory is a maintenance notice, not a
vulnerability. The debt weighs more here than for the entries above, because
this parser sits in front of YAML that comes from the network and from other
tools' config files.

RE-EVALUATE: at the next dependency review, budget the migration with the
existing YAML tests as the corpus; at once if a vulnerability is filed
against unsafe-libyaml or serde_yaml.
""" },

]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "OpenSSL",
  "MPL-2.0",
  # Public-domain-equivalent dedication; imposes no conditions on a
  # redistributed binary. Previously reached via tauri-plugin-deep-link;
  # kept so a remaining or future crate on that dedication does not fail closed.
  "CC0-1.0",
  # Mozilla's CA root certificate bundle (webpki-roots / webpki-root-certs),
  # reached through both reqwest 0.12 and 0.13. CDLA-Permissive-2.0 is a
  # permissive *data* licence with no copyleft and no attribution obligation
  # beyond keeping the disclaimer. This is certificate data, not code.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# RESOLVED on 2026-08-14 (was the last `licenses` failure): html2md 0.2.15 is
#   GPL-3.0+ and was rejected by the allow list above. It was **removed**, not
#   allowlisted — `ss-marketplace` now depends on htmd 0.5.5
#   (Apache-2.0, the same licence this repo ships under).
#
#   Why removal and not an allowlist entry: SkillStar ships as an Apache-2.0
#   desktop binary and Rust links statically, so a GPL-3.0-or-later dependency
#   was a genuine copyleft question about the distributed artifact, not a lint
#   to silence. Adding it to `allow` would have been CI wiring silently making
#   a licensing call. The alternatives that were weighed and rejected: accept
#   the copyleft obligation and relicense; or allowlist it with a written
#   owner decision. Do not re-add html2md — reach for htmd instead.
#
#   Replacement notes, kept because they are the reason htmd was picked:
#     htmd 0.5.5       license = "Apache-2.0"   <- same licence as this repo
#     html2text 0.17.1 license = "MIT"          <- NOT equivalent, do not use:
#       its own description is "Render HTML as plain text", so it silently
#       drops the Markdown formatting the two converted fields exist to keep.
#   The two call sites (remote/skill_details.rs) went from the infallible
#   `html2md::parse_html(&str) -> String` to `htmd::convert(&str) ->
#   Result<String, io::Error>` behind a `prose_html_to_markdown` helper that
#   logs and returns `None` on failure. Output is not byte-identical: htmd
#   emits ATX headings, turndown-style list indentation and `* * *` rules, and
#   — unlike html2md — preserves the code-fence language. No construct was
#   lost (headings, nested lists, links, fenced code, tables all survive);
#   `remote::skill_details::tests` now pins that, and was added with this
#   change because the path had no coverage at all before it.
#
#   RESOLVED on 2026-08-14 (was blocker #2 here): all 13 workspace crates
#   used to report `unlicensed`. Fixed properly in the manifests rather than
#   in this file — `license = "Apache-2.0"` on [workspace.package] in the root
#   Cargo.toml plus `license.workspace = true` on every member. Note for
#   future readers: `[licenses.private] ignore = true` does NOT solve that;
#   it only skips members marked `publish = false`.
# ---------------------------------------------------------------------------

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
