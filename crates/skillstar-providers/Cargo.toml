[package]
name = "skillstar-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

# Zero-dependency leaf crate: the single source of truth for provider metadata
# (balance endpoints, auth schemes, …). Both the usage-side fetchers and the
# models-side presets derive from the tables defined here, so the data lives in
# exactly one place. Keep this crate dependency-free so every layer can use it.
[dependencies]
