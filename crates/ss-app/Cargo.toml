[package]
name = "ss-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
name = "ss_app"
path = "src/lib.rs"
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ss-core = { path = "../ss-core" }
ss-marketplace = { path = "../ss-marketplace" }
ss-skills = { path = "../ss-skills" }
ss-git = { path = "../ss-git" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid.workspace = true
ts-rs = { workspace = true, features = ["serde-compat"] }
thiserror.workspace = true
base64.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io", "elicitation", "transport-async-rw"] }
schemars = { workspace = true }

[dev-dependencies]
futures.workspace = true
tempfile = { workspace = true }

[target."cfg(windows)".dev-dependencies]
junction.workspace = true
