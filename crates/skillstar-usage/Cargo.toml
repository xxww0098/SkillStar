[package]
name = "skillstar-usage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
machine-uid = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
tiny_http = "0.12"
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
skillstar-core = { path = "../skillstar-core" }
skillstar-providers = { path = "../skillstar-providers" }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
