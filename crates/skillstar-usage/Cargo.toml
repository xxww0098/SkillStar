[package]
name = "skillstar-usage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
machine-uid = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
tiny_http = "0.12"
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
skillstar-core = { version = "0.1.0", path = "../skillstar-core" }
skillstar-fingerprint = { version = "0.1.0", path = "../skillstar-fingerprint", default-features = false }
skillstar-providers = { version = "0.1.0", path = "../skillstar-providers" }
rusqlite = { workspace = true }

[features]
default = ["impersonate"]
# Forwards to skillstar-fingerprint's wreq-backed TLS emulation.
# Disable for ultra-light builds (CI / tests) — fingerprint usage degrades
# transparently to reqwest defaults.
impersonate = ["skillstar-fingerprint/impersonate"]

[dev-dependencies]
tempfile = { workspace = true }
