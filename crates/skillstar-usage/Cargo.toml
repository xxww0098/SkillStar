[package]
name = "skillstar-usage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
machine-uid = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
tiny_http = "0.12"
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
skillstar-core = { version = "0.1.0", path = "../skillstar-core" }
skillstar-providers = { version = "0.1.0", path = "../skillstar-providers" }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
