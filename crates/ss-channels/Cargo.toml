[package]
name = "ss-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ss-core = { path = "../ss-core" }
ss-git = { path = "../ss-git" }
ss-skills = { path = "../ss-skills" }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
ss-skills = { path = "../ss-skills", features = ["test-support"] }
tempfile = { workspace = true }
