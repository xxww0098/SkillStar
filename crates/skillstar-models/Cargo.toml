[package]
name = "skillstar-models"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
skillstar-core = { version = "0.1.0", path = "../skillstar-core" }
skillstar-providers = { version = "0.1.0", path = "../skillstar-providers" }
ts-rs = { workspace = true, features = ["serde-compat"] }

# Inference (former skillstar-ai)
regex = { workspace = true }
machine-uid = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
async-openai = { version = "0.27", features = ["rustls"] }
futures-util = "0.3.32"
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_yaml.workspace = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = { workspace = true }
