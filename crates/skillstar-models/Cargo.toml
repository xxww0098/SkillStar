[package]
name = "skillstar-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
skillstar-core = { path = "../skillstar-core" }
skillstar-providers = { path = "../skillstar-providers" }
ts-rs = { workspace = true, features = ["serde-compat"] }

# Inference (former skillstar-ai)
regex = { workspace = true }
machine-uid = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
async-openai = { version = "0.27", features = ["rustls"] }
futures-util = "0.3.32"
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_yaml.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = { workspace = true }
