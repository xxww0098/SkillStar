[package]
name = "skillstar-channels"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
skillstar-core = { version = "0.1.0", path = "../skillstar-core" }
skillstar-git = { version = "0.1.0", path = "../skillstar-git" }
skillstar-skills = { version = "0.1.0", path = "../skillstar-skills" }
skillstar-github-auth = { version = "0.1.0", path = "../skillstar-github-auth" }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
skillstar-agents = { version = "0.1.0", path = "../skillstar-agents" }
sha2 = { workspace = true }
