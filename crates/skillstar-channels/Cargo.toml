[package]
name = "skillstar-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
skillstar-core = { path = "../skillstar-core" }
skillstar-git = { path = "../skillstar-git" }
skillstar-skills = { path = "../skillstar-skills" }
skillstar-github-auth = { path = "../skillstar-github-auth" }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
skillstar-agents = { path = "../skillstar-agents" }
sha2 = { workspace = true }
