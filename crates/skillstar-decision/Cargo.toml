[package]
name = "skillstar-decision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# `candle-core` is the only ML dependency in the workspace, and it is confined
# to this crate: provider CRUD, tool sync and the App AI HTTP path have no
# business compiling a tensor library. Versions are pinned here rather than in
# the root table because nothing else consumes them.
candle-core = "0.11"
candle-nn = "0.11"
futures.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skillstar-core = { version = "0.0.0", path = "../skillstar-core" }
thiserror.workspace = true
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
ts-rs = { workspace = true, features = ["serde-compat"] }

# Metal is the difference between a ~3 s CPU prefill and an interactive one on
# Apple silicon. Other targets stay on the CPU backend.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }

[dev-dependencies]
tempfile.workspace = true
