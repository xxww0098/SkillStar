[package]
name = "skillstar-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
skillstar-core = { path = "../skillstar-core" }
serde_yaml = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
base64.workspace = true
scraper = "0.27.0"
skillstar-git = { path = "../skillstar-git" }
skillstar-agents = { path = "../skillstar-agents" }
skillstar-github-auth = { path = "../skillstar-github-auth" }
reqwest.workspace = true

[target."cfg(windows)".dependencies]
junction = { workspace = true }

# Every `tempfile` use in this crate sits behind `#[cfg(test)]` — the sibling
# `*_tests.rs` files are mounted from `#[cfg(test)] mod` declarations — so it is
# a test-only dependency. `[dev-dependencies]` are visible to the lib target
# under `cfg(test)`, which is what those tests compile as.
[dev-dependencies]
tempfile = { workspace = true }
