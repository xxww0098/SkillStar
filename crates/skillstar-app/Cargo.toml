[package]
name = "skillstar-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[lib]
name = "skillstar_app"
path = "src/lib.rs"


[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
skillstar-core = { version = "0.1.0", path = "../skillstar-core" }
skillstar-marketplace = { version = "0.1.3", path = "../skillstar-marketplace" }
skillstar-models = { version = "0.1.0", path = "../skillstar-models" }
skillstar-skills = { version = "0.1.0", path = "../skillstar-skills" }
skillstar-usage = { version = "0.1.0", path = "../skillstar-usage" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
