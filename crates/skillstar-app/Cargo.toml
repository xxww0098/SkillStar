[package]
name = "skillstar-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
name = "skillstar_app"
path = "src/lib.rs"
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs.workspace = true
futures.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
skillstar-core = { path = "../skillstar-core" }
skillstar-marketplace = { path = "../skillstar-marketplace" }
skillstar-models = { path = "../skillstar-models" }
skillstar-skills = { path = "../skillstar-skills" }
skillstar-git = { path = "../skillstar-git" }
skillstar-channels = { path = "../skillstar-channels" }
skillstar-usage = { path = "../skillstar-usage" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid.workspace = true
ts-rs = { workspace = true, features = ["serde-compat"] }
thiserror.workspace = true
base64.workspace = true

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }
