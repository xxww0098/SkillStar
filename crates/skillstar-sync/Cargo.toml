[package]
name = "skillstar-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
skillstar-core = { version = "0.1.0", path = "../skillstar-core" }
skillstar-skills = { version = "0.1.0", path = "../skillstar-skills" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs", "io-util"] }
tracing = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
# S3-compatible object storage. aws-sdk-s3 talks to any S3 API
# (Cloudflare R2 / Backblaze B2 / 七牛云 / 阿里云 OSS / 腾讯云 COS / AWS S3 / MinIO)
# once a custom endpoint_url is supplied via S3TargetDef.
aws-sdk-s3 = "1"
aws-config = { version = "1", default-features = false, features = ["rustls"] }
# Content-addressed tarballs (sha256) + packing for local-authored skills.
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# keyring v4 default (`v1`) bundles the native store for each desktop OS
# Credentials never touch the TOML (keyring).
keyring = { workspace = true }
# SSH (former skillstar-ssh)
dirs = { workspace = true }
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"
ssh-key = { version = "=0.7.0-rc.10", features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
