[package]
name = "skillstar-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
skillstar-core = { version = "0.1.0", path = "../skillstar-core" }
skillstar-skills = { version = "0.1.0", path = "../skillstar-skills" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs", "io-util"] }
tracing = { workspace = true }
toml = { workspace = true }
# keyring v4 default (`v1`) bundles the native store for each desktop OS
# Credentials never touch the TOML (keyring).
keyring = { workspace = true }
# SSH (former skillstar-ssh)
dirs = { workspace = true }
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"
ssh-key = { version = "=0.7.0-rc.10", features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
