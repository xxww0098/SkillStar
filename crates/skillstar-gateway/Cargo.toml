[package]
name = "skillstar-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Internal path dep, never goes to crates.io.
publish = false

[lib]
# No doc tests in this workspace; the crates are internal path deps, not a
# published API whose examples need to keep compiling.
doctest = false

[lints]
workspace = true

[dependencies]
# Exact pins: these crates are already in the workspace lock via reqwest.
# A caret range would bump every HTTP caller.
bytes = "=1.11.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.9.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
skillstar-core = { version = "0.0.0", path = "../skillstar-core" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }

[dev-dependencies]
serde_json.workspace = true
