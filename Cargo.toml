[workspace]
resolver = "3"
members = [
  "src-tauri",
  "crates/*",
]
default-members = ["src-tauri"]

# Shared package metadata. Members opt in with `edition.workspace = true` etc.
# None of the skillstar-* crates are published — they are wired together with
# path deps — so they share one placeholder `version` instead of each keeping a
# semver nobody consumes. `src-tauri` is the exception: it keeps its own
# `version`, which is the product version, and inherits only edition/MSRV.
[workspace.package]
edition = "2024"
rust-version = "1.94.1"
version = "0.0.0"
# Matches the Apache-2.0 LICENSE at the repo root. Stating it here is what
# stops `cargo deny check licenses` reporting every member as `unlicensed`:
# the root LICENSE file is invisible to per-crate metadata.
license = "Apache-2.0"

# Shared third-party dependency versions for every member crate that pulls in
# ≥2 of them. Pin to whatever Cargo.lock already resolved at the time this
# table was introduced — the goal is convergence, not upgrades. Member crates
# opt in with `dep = { workspace = true }` (optionally appending their own
# extra `features = [...]`; workspace feature lists are unioned in, not
# replaced). Path deps between our own skillstar-* crates stay declared
# per-crate rather than routed through this table.
[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1"
futures = "0.3"
gix = { version = "0.80", default-features = false, features = ["max-control", "blocking-http-transport-reqwest-rust-tls", "revision", "credentials"] }
htmd = "0.5.5"
junction = "2.0.0"
keyring = { version = "4", default-features = false, features = ["v1"] }
machine-uid = "0.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"
rand = "0.10.0"
regex = "1.12"
# system-proxy: honor HTTP(S)_PROXY env vars and the macOS/Windows system proxy
# when the in-app proxy is not configured; without it api.github.com is a dead
# 10s timeout per repo on proxied networks while git (which reads its own proxy
# config) succeeds.
reqwest = { version = "0.13.3", default-features = false, features = ["system-proxy"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon", "image-png"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3" }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
which = "8.0.2"

# Workspace-wide lint table. This is inert for any member that does not also
# carry `[lints] workspace = true`, so all 10 members opt in explicitly.
#
# Ratchet rule: a lint only enters this table at `deny` when its violation count
# across the workspace is measured to be 0 on the day it lands, so adding it
# never turns CI red. Lints with real existing volume (`clippy::unwrap_used` at
# 2744 sites, `clippy::expect_used` at 689) stay out entirely — a table of
# ignored warnings dilutes the signal from the entries that mean something.
[workspace.lints.clippy]
todo = "deny"           # measured 0 occurrences workspace-wide, 2026-08-14
unimplemented = "deny"  # measured 0 occurrences workspace-wide, 2026-08-14
dbg_macro = "deny"      # measured 0 occurrences workspace-wide, 2026-08-14

[profile.release]
# `thin` rather than `fat`: measured on this workspace (2026-08-14, cold build,
# aarch64-apple-darwin) fat took 425.20s for a 31.1 MiB binary, thin took
# 299.09s for 33.5 MiB — 29.7% less build time for 7.6% more size. Runtime cost
# was NOT measured; the heavy work here is file I/O, git transport, HTTP and
# SQLite rather than compute, so the tradeoff is judged worth it.
lto = "thin"
codegen-units = 1
strip = "symbols"

# Release-shaped build for packaging smoke tests — "does the bundle start?" —
# where final runtime performance does not matter. Measured 149.42s cold vs the
# release profile's 299.09s. Artifacts land in target/release-fast/, not
# target/release/.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

# Same opt-level / LTO / codegen-units as `release`, plus line tables and
# frame-pointer-friendly symbols so samply / cargo-flamegraph can name frames.
# `strip` must stay off — inheriting `release`'s `strip = "symbols"` produces
# `[unknown]` graphs (PERF-06). Force frame pointers on the profiling command
# with `RUSTFLAGS='-C force-frame-pointers=yes'`, not the default rustflags.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.profiling.build-override]
debug = false
