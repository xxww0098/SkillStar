name: Windows CI

# Catches Windows-specific regressions (paths, shell calls, line endings)
# that local macOS/Linux development would miss.
#
# ## Failure lessons (from Actions history — do not re-learn the hard way)
#
# 1. Dual lockfile drift kills this job at step one.
#    Local dev + Linux/macOS CI use Bun (`bun.lock`). This workflow uses npm
#    (`package-lock.json`) on purpose so we exercise the Windows/npm path.
#    After ANY dependency change you MUST update BOTH lockfiles in the same PR:
#      bun install
#      npm install --package-lock-only   # or full `npm install` if needed
#    Historical signal: every Windows CI run through 2026-07 failed on
#    `npm ci` with "Missing: … from lock file" / "lock file's X does not
#    satisfy Y" because package.json / bun.lock moved and package-lock.json
#    was left behind. Zero green runs → zero Windows path coverage. A red
#    install step is not "Windows is flaky"; it is an unmaintained lockfile.
#    Root cause found 2026-07-26: a developer-global ~/.npmrc with
#    legacy-peer-deps=true generated lockfiles without auto-installed peers,
#    which `npm ci` (default behaviour) rejects. The repo-level .npmrc now
#    pins legacy-peer-deps=false so local lock generation matches CI.
#
# 2. Do not "fix" install failures with `npm install` (non-ci) in this
#    workflow. That hides drift and makes Windows CI non-reproducible.
#    Keep `npm ci`; fix the lockfile in the PR instead.
#
# 3. Keep the file-size guard on bash even on Windows runners — the ratchet
#    scripts assume a POSIX shell.
#
# 4. src-tauri's test exe cannot load on GitHub Windows runners (first seen
#    2026-07-26, the first run that ever got past `npm ci`): it exits with
#    0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND before any test executes — a
#    WebView2Loader/system DLL entrypoint mismatch, not a test failure. The
#    Rust step therefore runs `--workspace --exclude skillstar`; Windows path
#    and shell coverage lives in the crates, which all still run. If you want
#    src-tauri unit tests on Windows, fix the DLL loading first (pin/install
#    a matching WebView2 runtime on the runner) instead of removing the
#    exclusion blindly.
#
# 5. Channel content-hash fixtures must pin `core.autocrlf=false` and
#    `core.eol=lf` (and treat files as `-text`). Windows runners default
#    `autocrlf=true`, so `git archive` / clone rewrite LF fixtures and
#    `sha256:` no longer matches Linux. Do not "fix" this by accepting
#    whatever hash Windows computed, and do not hardcode a second Windows
#    digest.
#
# 6. After those hash fixtures go green, `configured_proxy_is_operation_local`
#    can fail next: Windows env names are case-insensitive, so
#    `env_remove("http_proxy")` plus `env("HTTP_PROXY", …)` does not leave a
#    distinct `http_proxy=None` in `get_envs()`. Assert that the lowercase
#    alias is absent or cleared; do not require Unix `Some(None)` on Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Reads the pin out of rust-toolchain.toml instead of hard-coding it —
      # identical to ci.yml's steps, where the long rationale lives (ci.yml
      # failure lesson #7). `shell: bash` matters here: this runner defaults to
      # pwsh, and the script is POSIX sh.
      - name: Resolve pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)"
          components="$(sed -n 's/^[[:space:]]*components[[:space:]]*=[[:space:]]*\[\(.*\)\].*/\1/p' rust-toolchain.toml | tr -d ' "' | head -1)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml: cannot read [toolchain] channel"; exit 1; }
          [ -n "$components" ] || { echo "::error::rust-toolchain.toml: cannot read [toolchain] components"; exit 1; }
          case "$channel" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::rust-toolchain.toml channel must be an exact x.y.z version, got '$channel'"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "pinned toolchain: $channel (components: $components)"

      - name: Set up Rust ${{ steps.rust.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: ${{ steps.rust.outputs.components }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Frontend tests
        run: npm test

      # src-tauri (`skillstar`) lib tests are excluded: the test exe dies at
      # load time on GitHub Windows runners with 0xc0000139
      # STATUS_ENTRYPOINT_NOT_FOUND (WebView2Loader/system DLL entrypoint
      # mismatch) before running a single test — see failure lesson 4.
      - name: Rust tests (workspace, excluding src-tauri)
        run: cargo test --workspace --locked --exclude skillstar

      - name: File-size guard (structural governance)
        shell: bash
        run: scripts/internal/check_file_size.sh
